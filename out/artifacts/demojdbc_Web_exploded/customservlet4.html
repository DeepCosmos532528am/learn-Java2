<h1>The form for the Get Method trigger</h1>
<form action="customservlet4" method="get">
  <input type="text" name="username">
    <input type="submit" name="register" value="Login" placeholder="Login">
    <input type="submit" name="register" value="SignUp" placeholder="SignUp">

<h1>The form for the Post Method trigger</h1>
<form action="customservlet4" method="post">
    <input type="text" name="username">
    <input type="radio" value="male" name="Gender">
    <input type="radio" value="female" name="Gender">
    <input type="submit">
</form>
</body>
