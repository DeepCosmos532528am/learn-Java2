<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div style="width: 400px; margin: 50px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; color: #333;">Registration Form</h2>

    <form action="loginstatus" >
        <!-- Name -->
        <label style="display:block; margin-bottom:8px; color:#555;">Full Name:</label>
        <input type="text" name="fullname" style="width:100%; padding:8px; margin-bottom:15px; border:1px solid #ccc; border-radius:4px;">

        <!-- Email -->
        <label style="display:block; margin-bottom:8px; color:#555;">Email:</label>
        <input type="email" name="email" style="width:100%; padding:8px; margin-bottom:15px; border:1px solid #ccc; border-radius:4px;">

        <!-- Password -->
        <label style="display:block; margin-bottom:8px; color:#555;">Password:</label>
        <input type="password" name="password" style="width:100%; padding:8px; margin-bottom:15px; border:1px solid #ccc; border-radius:4px;">

        <!-- Gender -->
        <label style="display:block; margin-bottom:8px; color:#555;">Gender:</label>
        <input type="radio" name="gender" value="male" style="margin-right:5px;"> Male
        <input type="radio" name="gender" value="female" style="margin-left:15px; margin-right:5px;"> Female
        <input type="radio" name="gender" value="other" style="margin-left:15px; margin-right:5px;"> Other
        <br><br>

        <!-- Interests -->
        <label style="display:block; margin-bottom:8px; color:#555;">Interests:</label>
        <input type="checkbox" name="interest" value="coding" style="margin-right:5px;"> Coding
        <input type="checkbox" name="interest" value="music" style="margin-left:15px; margin-right:5px;"> Music
        <input type="checkbox" name="interest" value="sports" style="margin-left:15px; margin-right:5px;"> Sports
        <br><br>

        <!-- Submit -->
        <button type="submit" style="width:100%; padding:10px; background:#28a745; color:#fff; border:none; border-radius:4px; font-size:16px; cursor:pointer;">
            Submit
        </button>
    </form>
</div>

</body>
</html>
